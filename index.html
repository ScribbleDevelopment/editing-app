<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Scribble Studio Ultimate Pro</title>
    <style>
        :root {
            --bg-base: #0c0c10;
            --bg-surface: #14141a;
            --bg-elevated: #1e1e28;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #27273a;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 52px;
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .logo {
            font-weight: 800;
            font-size: 16px;
            background: linear-gradient(135deg, #fff, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .workspace {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
            overflow-y: auto;
        }

        .panel-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.8px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: var(--bg-elevated);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .control-group label {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn.secondary {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        .btn.secondary:hover {
            background: var(--border);
        }

        .btn.danger {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .btn.danger:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .canvas-area {
            flex: 1;
            background: #08080c;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .canvas-container {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            overflow: hidden;
            background: repeating-conic-gradient(#121218 0% 25%, #0e0e12 0% 50%);
            background-size: 24px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 72vh;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
        }

        .top-actions {
            display: flex;
            gap: 8px;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Scribble Studio Ultimate Pro</div>
        <div class="top-actions">
            <button class="btn secondary" onclick="document.getElementById('fileInput').click()">Import Image</button>
            <button class="btn" onclick="exportImage()">Export Image</button>
        </div>
    </header>

    <div class="workspace">
        <div class="sidebar">
            <div class="panel-section">
                <div class="section-title">Quick Actions</div>
                <div class="btn-grid">
                    <button class="btn secondary" onclick="resetImage()">Reset</button>
                    <button class="btn secondary" onclick="invertColors()">Invert</button>
                    <button class="btn secondary" onclick="applyGrayscale()">B&W</button>
                    <button class="btn secondary" onclick="applySepia()">Sepia</button>
                </div>
                <button class="btn danger" onclick="removeBackgroundAdvanced()" style="width: 100%; margin-top: 4px;">Smart Chroma Key BG Remove</button>
            </div>

            <div class="panel-section">
                <div class="section-title">Color & Light Matrix</div>
                
                <div class="control-group">
                    <label><span>Brightness</span><span id="val-brightness">0</span></label>
                    <input type="range" id="brightness" min="-100" max="100" value="0" oninput="applyFilters()">
                </div>

                <div class="control-group">
                    <label><span>Contrast</span><span id="val-contrast">0</span></label>
                    <input type="range" id="contrast" min="-100" max="100" value="0" oninput="applyFilters()">
                </div>

                <div class="control-group">
                    <label><span>Saturation</span><span id="val-saturation">0</span></label>
                    <input type="range" id="saturation" min="-100" max="100" value="0" oninput="applyFilters()">
                </div>

                <div class="control-group">
                    <label><span>Exposure</span><span id="val-exposure">0</span></label>
                    <input type="range" id="exposure" min="-50" max="50" value="0" oninput="applyFilters()">
                </div>
            </div>

            <div class="panel-section">
                <div class="section-title">Advanced Filters</div>
                
                <div class="control-group">
                    <label><span>Blur Radius</span><span id="val-blur">0</span></label>
                    <input type="range" id="blur" min="0" max="20" value="0" oninput="applyFilters()">
                </div>

                <div class="control-group">
                    <label><span>Vignette Intensity</span><span id="val-vignette">0</span></label>
                    <input type="range" id="vignette" min="0" max="100" value="0" oninput="applyFilters()">
                </div>

                <div class="control-group">
                    <label><span>Noise Grain</span><span id="val-noise">0</span></label>
                    <input type="range" id="noise" min="0" max="50" value="0" oninput="applyFilters()">
                </div>
            </div>

            <div class="panel-section">
                <div class="section-title">Geometric Transforms</div>
                <div class="btn-grid">
                    <button class="btn secondary" onclick="rotateImage(90)">Rotate 90°</button>
                    <button class="btn secondary" onclick="flipImage('h')">Flip H</button>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div class="canvas-container">
                <canvas id="editorCanvas"></canvas>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" accept="image/*" onchange="loadPhoto(event)">

<script>
    const canvas = document.getElementById('editorCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    let originalImage = null;
    let baseWidth = 0;
    let baseHeight = 0;

    function loadPhoto(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                baseWidth = img.width;
                baseHeight = img.height;
                canvas.width = baseWidth;
                canvas.height = baseHeight;
                ctx.drawImage(img, 0, 0);
                
                originalImage = ctx.getImageData(0, 0, baseWidth, baseHeight);
                resetSliders();
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    function resetSliders() {
        ['brightness', 'contrast', 'saturation', 'exposure', 'blur', 'vignette', 'noise'].forEach(id => {
            document.getElementById(id).value = 0;
            document.getElementById('val-' + id).innerText = 0;
        });
    }

    function resetImage() {
        if (!originalImage) return;
        canvas.width = baseWidth;
        canvas.height = baseHeight;
        ctx.putImageData(originalImage, 0, 0);
        resetSliders();
    }

    function applyFilters() {
        if (!originalImage) return;

        const b = parseInt(document.getElementById('brightness').value);
        const c = parseInt(document.getElementById('contrast').value);
        const s = parseInt(document.getElementById('saturation').value);
        const exp = parseInt(document.getElementById('exposure').value);
        const blur = parseInt(document.getElementById('blur').value);
        const vig = parseInt(document.getElementById('vignette').value);
        const noise = parseInt(document.getElementById('noise').value);

        document.getElementById('val-brightness').innerText = b;
        document.getElementById('val-contrast').innerText = c;
        document.getElementById('val-saturation').innerText = s;
        document.getElementById('val-exposure').innerText = exp;
        document.getElementById('val-blur').innerText = blur;
        document.getElementById('val-vignette').innerText = vig;
        document.getElementById('val-noise').innerText = noise;

        canvas.width = baseWidth;
        canvas.height = baseHeight;
        ctx.putImageData(originalImage, 0, 0);

        let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let data = imgData.data;

        let factor = (259 * (c + 255)) / (255 * (259 - c));

        for (let i = 0; i < data.length; i += 4) {
            let r = data[i];
            let g = data[i+1];
            let bl = data[i+2];

            r += exp * 2;
            g += exp * 2;
            bl += exp * 2;

            r += b;
            g += b;
            bl += b;

            r = factor * (r - 128) + 128;
            g = factor * (g - 128) + 128;
            bl = factor * (bl - 128) + 128;

            let gray = 0.299 * r + 0.587 * g + 0.114 * bl;
            r = gray + (1 + s / 100) * (r - gray);
            g = gray + (1 + s / 100) * (g - gray);
            bl = gray + (1 + s / 100) * (bl - gray);

            if (noise > 0) {
                let n = (Math.random() - 0.5) * noise * 4;
                r += n; g += n; bl += n;
            }

            data[i] = Math.min(255, Math.max(0, r));
            data[i+1] = Math.min(255, Math.max(0, g));
            data[i+2] = Math.min(255, Math.max(0, bl));
        }

        ctx.putImageData(imgData, 0, 0);

        let filters = [];
        if (blur > 0) filters.push(`blur(${blur}px)`);
        ctx.filter = filters.join(' ');
        ctx.drawImage(canvas, 0, 0);
        ctx.filter = 'none';

        if (vig > 0) {
            let gradient = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.width*0.2, canvas.width/2, canvas.height/2, canvas.width*0.75);
            gradient.addColorStop(0, 'rgba(0,0,0,0)');
            gradient.addColorStop(1, `rgba(0,0,0,${vig / 100})`);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
    }

    function applyGrayscale() {
        if (!originalImage) return;
        let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
            let avg = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
            data[i] = avg; data[i+1] = avg; data[i+2] = avg;
        }
        ctx.putImageData(imgData, 0, 0);
        originalImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
    }

    function applySepia() {
        if (!originalImage) return;
        let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
            let r = data[i], g = data[i+1], b = data[i+2];
            data[i]   = Math.min(255, (r * 0.393) + (g * 0.769) + (b * 0.189));
            data[i+1] = Math.min(255, (r * 0.349) + (g * 0.686) + (b * 0.168));
            data[i+2] = Math.min(255, (r * 0.272) + (g * 0.534) + (b * 0.131));
        }
        ctx.putImageData(imgData, 0, 0);
        originalImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
    }

    function invertColors() {
        if (!originalImage) return;
        let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
            data[i] = 255 - data[i];
            data[i+1] = 255 - data[i+1];
            data[i+2] = 255 - data[i+2];
        }
        ctx.putImageData(imgData, 0, 0);
        originalImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
    }

    function removeBackgroundAdvanced() {
        if (!originalImage) return;
        let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let data = imgData.data;
        let cornerR = data[0], cornerG = data[1], cornerB = data[2];
        for (let i = 0; i < data.length; i += 4) {
            let dr = data[i] - cornerR;
            let dg = data[i+1] - cornerG;
            let db = data[i+2] - cornerB;
            let dist = Math.sqrt(dr*dr + dg*dg + db*db);
            if (dist < 50) {
                data[i+3] = 0;
            }
        }
        ctx.putImageData(imgData, 0, 0);
        originalImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
    }

    function rotateImage(degrees) {
        if (!originalImage) return;
        let tempCanvas = document.createElement('canvas');
        let tempCtx = tempCanvas.getContext('2d');
        tempCanvas.width = canvas.height;
        tempCanvas.height = canvas.width;
        tempCtx.translate(tempCanvas.width / 2, tempCanvas.height / 2);
        tempCtx.rotate(degrees * Math.PI / 180);
        tempCtx.drawImage(canvas, -canvas.width / 2, -canvas.height / 2);
        
        baseWidth = tempCanvas.width;
        baseHeight = tempCanvas.height;
        canvas.width = baseWidth;
        canvas.height = baseHeight;
        ctx.drawImage(tempCanvas, 0, 0);
        originalImage = ctx.getImageData(0, 0, baseWidth, baseHeight);
    }

    function flipImage(direction) {
        if (!originalImage) return;
        let tempCanvas = document.createElement('canvas');
        let tempCtx = tempCanvas.getContext('2d');
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        tempCtx.translate(tempCanvas.width, 0);
        tempCtx.scale(-1, 1);
        tempCtx.drawImage(canvas, 0, 0);

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(tempCanvas, 0, 0);
        originalImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
    }

    function exportImage() {
        if (!originalImage) return;
        const link = document.createElement('a');
        link.download = 'ScribbleStudio_Pro_Edit.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    window.onload = () => {
        canvas.width = 800;
        canvas.height = 600;
        baseWidth = 800;
        baseHeight = 600;
        ctx.fillStyle = "#1e1e28";
        ctx.fillRect(0, 0, 800, 600);
        ctx.fillStyle = "#94a3b8";
        ctx.font = "bold 20px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Tap 'Import Image' to start editing", 400, 300);
        originalImage = ctx.getImageData(0, 0, 800, 600);
    };
</script>
</body>
</html>
